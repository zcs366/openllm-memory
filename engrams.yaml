    statement: >-
      并行翻译大规模文学作品的实践模式：将大型源文件按章节切分为独立parts，每个part由独立子Agent翻译，主Agent仅传递2KB上下文而非全部原文。10个子Agent可同时工作，互不干扰。适用于任何超过5000行的文学翻译项目。关键约束：每个子Agent必须有明确的行范围(L起始-结束)、输出路径、格式规范。
